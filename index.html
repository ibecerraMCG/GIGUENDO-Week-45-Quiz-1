<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 45 Practice Quiz 1</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        [data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }

        [data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }

        [data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }

        [data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 45 Practice Quiz 1</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Biostatistics ---
            {
                section: "Biostatistics",
                fullLO: "LO1: Distinguish between phases of clinical trials",
                question: "A pharmaceutical company has developed a new drug for the treatment of hypertension. After successful testing in animal models, the company initiates the very first trial in humans. They enroll 15 healthy volunteers to primarily emphasize the safety of the drug and obtain information on its mechanism of action and pharmacokinetics. Which of the following phases of clinical trials does this represent?",
                options: {
                    A: "Preclinical Phase",
                    B: "Phase I trial",
                    C: "Phase II trial",
                    D: "Phase III trial",
                    E: "Phase IV trial"
                },
                correctAnswer: "B",
                rationale: "Phase I trials are the first step in humans, involving 10-20 healthy volunteers. This phase emphasizes safety, attempting to answer the question 'Is it safe?' and gathering information on the drug's mechanism of action, metabolism, and excretion.",
                source: "Biostatistics PDF, slide 3: 'Phase I trial • This phase emphasizes safety. It involves 20 to 80 healthy volunteers... Healthy 10-20. Is it safe?'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO1: Distinguish between phases of clinical trials",
                question: "A team of oncology researchers is evaluating a new chemotherapy regimen for breast cancer. They design a large-scale, multicenter study enrolling 3,000 patients with the disease to formally compare the new regimen against the current standard of care. The primary goal is to determine if the new drug is as good as or better than existing treatments regarding efficacy and safety. Which of the following phases of clinical trials does this describe?",
                options: {
                    A: "Phase I trial",
                    B: "Phase II trial",
                    C: "Phase III trial",
                    D: "Phase IV trial",
                    E: "Preclinical Phase"
                },
                correctAnswer: "C",
                rationale: "Phase III trials involve hundreds or thousands of patients and are concerned with safety and efficacy compared to existing treatments, answering the question 'Is it as good or better?'",
                source: "Biostatistics PDF, slide 3: 'Phase III trial • Phase III trials typically involve hundreds or thousands of patients. • Information more concerned on safety and efficacy... Thousands of participants. Is it as good or better?'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO2: Compare and contrast measures of central tendency",
                question: "A medical student is analyzing the hospital length of stay (in days) for patients recovering from a specific surgical procedure. Most patients go home in 2 to 4 days, but three patients experienced severe complications and stayed in the hospital for over 45 days. The student notes that one measure of central tendency was pulled significantly higher by these three patients. Which of the following measures is most sensitive to these extreme outliers?",
                options: {
                    A: "Interquartile Range",
                    B: "Mean",
                    C: "Median",
                    D: "Mode",
                    E: "Standard Deviation"
                },
                correctAnswer: "B",
                rationale: "The mean is the average of the data and is very sensitive to outliers. In a skewed distribution with extreme values, the mean is 'pulled' toward the tail (the outliers), whereas the median and mode are not sensitive to outliers.",
                source: "Biostatistics PDF, slides 5 & 13: 'Sensitivity to Outliers | Measure of Location: mean | very sensitive: check mark' and 'The mean is “pulled” toward the tail.'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO2: Compare and contrast measures of central tendency",
                question: "A researcher collects blood pressure data from 100 participants. When summarizing the data, the researcher decides to report the specific blood pressure reading that occurred most frequently among the participants. Which of the following measures of central tendency is the researcher reporting?",
                options: {
                    A: "Average",
                    B: "Mean",
                    C: "Median",
                    D: "Mode",
                    E: "Range"
                },
                correctAnswer: "D",
                rationale: "The mode is defined strictly as the data value that occurs most frequently in a dataset.",
                source: "Biostatistics PDF, slide 5: 'Mode – Data value that occurs most frequently'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO3: Distinguish between standard deviation and standard error",
                question: "A public health official calculates the mean BMI of a sample of 500 adult men in a particular city. To describe the dispersion of this data, she reports a value that represents the average distance that the individual participants' BMI values lie from the sample mean. Which of the following statistical terms is she reporting?",
                options: {
                    A: "Coefficient of Variation",
                    B: "Interquartile Range",
                    C: "Standard Deviation",
                    D: "Standard Error",
                    E: "Variance"
                },
                correctAnswer: "C",
                rationale: "Standard Deviation is the most common measure of dispersion in statistics and specifically represents the average distance that the individual data values lie from the mean.",
                source: "Biostatistics PDF, slide 7: 'Standard Deviation • Represents the average distance the data values lie from the mean. • Most common measure of dispersion in statistics.'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO3: Distinguish between standard deviation and standard error",
                question: "A clinical trial reports a sample mean reduction in LDL cholesterol of 30 mg/dL. In order to calculate the 95% confidence interval and demonstrate how different the true population mean is likely to be from this specific sample mean, the researchers must calculate which of the following parameters?",
                options: {
                    A: "Coefficient of Variation",
                    B: "Median",
                    C: "Range",
                    D: "Standard Deviation",
                    E: "Standard Error"
                },
                correctAnswer: "E",
                rationale: "Standard Error (SE) represents how different the population mean is likely to be from the sample mean and is explicitly used for calculating confidence intervals and test statistics.",
                source: "Biostatistics PDF, slide 19: 'Standard Error • Represents how different the population mean is likely to be from the sample mean ... • Used for calculating confidence intervals and test statistics'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO4: Understand the normal distribution and skewed distributions",
                question: "A physician reviews the distribution of ages at diagnosis for a rare pediatric cancer. The curve shows a large peak at age 2, with a long tail stretching out toward age 18. Because the data has a long tail to the right, which of the following mathematical relationships between the measures of central tendency is correct for this dataset?",
                options: {
                    A: "Mean < Median < Mode",
                    B: "Mean = Median = Mode",
                    C: "Mean > Median > Mode",
                    D: "Median > Mean > Mode",
                    E: "Mode > Mean > Median"
                },
                correctAnswer: "C",
                rationale: "This describes a positively skewed distribution (skewed to the right). Because the mean is 'pulled' toward the tail, the mean will be larger than the median, and the median is larger than the mode (Positive: Mean > median > mode).",
                source: "Biostatistics PDF, slide 13: 'If the data is positively skewed (skewed to the right), the mean will be larger than the median. The mean is “pulled” toward the tail. Positive: Mean>median>mode'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO4: Understand the normal distribution and skewed distributions",
                question: "A population of healthy adults has normally distributed resting heart rates with a mean of 70 beats per minute and a standard deviation of 5 beats per minute. According to the Empirical Rule for a normal (Gaussian) distribution, approximately 95% of this population will have a resting heart rate falling between which of the following ranges?",
                options: {
                    A: "55 and 85",
                    B: "60 and 80",
                    C: "65 and 75",
                    D: "70 and 80",
                    E: "75 and 85"
                },
                correctAnswer: "B",
                rationale: "In a normal distribution, the Empirical Rule states that approximately 68% of the data falls within 1 standard deviation of the mean, 95% falls within 2 standard deviations, and 99.7% falls within 3 standard deviations. Two standard deviations from a mean of 70 is 10 (2 x 5). Therefore, 95% of the data falls between 60 (70 - 10) and 80 (70 + 10).",
                source: "Biostatistics PDF, slide 11: 'Empirical Rule [Graph showing 95% encompassing µ - 2σ to µ + 2σ]'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO5: Summarize common statistical terms (null hypothesis, alternative hypothesis, p-value, Type I error, Type II error, and confidence intervals)",
                question: "A clinical trial compares a new weight-loss drug to a placebo. The researchers observe a mean weight loss of 10 lbs in the drug group and 2 lbs in the placebo group, yielding a p-value of 0.03. Which of the following is the most accurate definition of this specific p-value?",
                options: {
                    A: "The probability that the drug is highly effective.",
                    B: "The probability of observing a difference of 8 lbs or more extreme, assuming the drug has no effect (the null hypothesis is true).",
                    C: "The probability that the null hypothesis is entirely false.",
                    D: "The probability that the alternative hypothesis is entirely true.",
                    E: "The probability of rejecting the null hypothesis when it is actually true."
                },
                correctAnswer: "B",
                rationale: "The p-value is the probability that you observe something as extreme or more extreme than your sample value, assuming that the null hypothesis (which assumes 'no effect' or 'no difference') is true.",
                source: "Biostatistics PDF, slide 15: 'P-Value • Probability that you observe something as extreme or more extreme than your sample value (ex: mean), assuming that the null hypothesis is true.'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO5: Summarize common statistical terms (null hypothesis, alternative hypothesis, p-value, Type I error, Type II error, and confidence intervals)",
                question: "A researcher conducts a study on a new blood pressure medication. The statistical analysis yields a p-value of 0.04, leading the researcher to claim that the drug significantly lowers blood pressure. However, five years later, definitive population-wide data proves the drug actually has absolutely no effect on blood pressure. The researcher's original conclusion represents which of the following statistical concepts?",
                options: {
                    A: "Alpha level",
                    B: "Power",
                    C: "Type I error",
                    D: "Type II error",
                    E: "Z-critical value"
                },
                correctAnswer: "C",
                rationale: "A Type I error occurs when you reject the null hypothesis when it is actually true. In this case, the null hypothesis (the drug has no effect) was true, but the researcher rejected it based on their sample data.",
                source: "Biostatistics PDF, slide 16: 'Type I and II errors o Type I error § Reject the null hypothesis when it’s actually true'"
            },
            {
                section: "Biostatistics",
                fullLO: "LO5: Summarize common statistical terms (null hypothesis, alternative hypothesis, p-value, Type I error, Type II error, and confidence intervals)",
                question: "A study evaluating a new surgical technique for joint repair fails to show a statistically significant improvement over the traditional technique, yielding a p-value of 0.15. The researchers accept the null hypothesis that there is no difference. Later, it is definitively proven that the new technique actually does significantly improve recovery times. The researchers' failure to detect this true difference is classified as a:",
                options: {
                    A: "Confidence Interval",
                    B: "Standard Error",
                    C: "Type I error",
                    D: "Type II error",
                    E: "Variance"
                },
                correctAnswer: "D",
                rationale: "A Type II error occurs when investigators accept (or fail to reject) the null hypothesis when it is actually false (i.e., missing a true effect or difference).",
                source: "Biostatistics PDF, slide 16: 'Type I and II errors ... o Type II error § Accept the null hypothesis when it’s actually false'"
            },
            {

                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
